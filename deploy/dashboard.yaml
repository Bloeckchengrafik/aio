# Use the same built image as the agent. Browser authentication belongs to Traefik.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aio-dashboard
  namespace: aio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aio-dashboard
  namespace: aio-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aio-dashboard
  namespace: aio-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aio-dashboard
subjects:
  - kind: ServiceAccount
    name: aio-dashboard
    namespace: aio-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aio-dashboard
  namespace: aio-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: aio-dashboard}
  template:
    metadata:
      labels: {app: aio-dashboard}
    spec:
      serviceAccountName: aio-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: dashboard
          image: ghcr.io/bloeckchengrafik/aio:prototype
          command: [/usr/local/bin/aio-dashboard]
          env:
            - name: AIO_DASHBOARD_LISTEN
              value: 0.0.0.0:8080
            - name: AIO_REGISTRATION_NAMESPACE
              value: aio-system
            - name: AIO_API_TOKEN
              valueFrom: {secretKeyRef: {name: aio-management, key: api-token}}
            # Must match the origin used by the authenticated Traefik ingress.
            - name: AIO_PUBLIC_ORIGIN
              value: https://aio.asorda.net
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: aio-dashboard
  namespace: aio-system
spec:
  selector: {app: aio-dashboard}
  ports:
    - name: http
      port: 8080
      targetPort: http
