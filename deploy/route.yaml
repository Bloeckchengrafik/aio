apiVersion: akasha.asorda.net/v1alpha1
kind: MinecraftRoute
metadata:
  name: asorda
  namespace: asorda
spec:
  hostnames: [asorda.net, play.asorda.net]
  backend:
    service: proxy
    port: 25565
  proxyProtocol: true
  allowConnections: true
  fallbackStatus:
    protocol: -1
    maintenance:
      motd: "Asorda is undergoing maintenance. Please try again later."
      versionName: Maintenance
    unavailable:
      motd: "Asorda is temporarily unavailable. Please try again shortly."
      versionName: Unavailable
    # favicon: "data:image/png;base64,<64x64 PNG>"
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: asorda
spec:
  clusterIP: None
  selector:
    prism.asorda.net/app: proxy
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
